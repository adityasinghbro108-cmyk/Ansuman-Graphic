<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Create Account | ANSUMAN GRAPHIC</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='design.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='accounts.css') }}"></head>
<body class="studio-body"><header class="studio-nav"><a class="logo" href="/">ANSUMAN<span> GRAPHIC</span></a><a class="cart-nav" href="/login">Sign in</a></header><main class="auth-shell"><section class="auth-card"><span class="eyebrow">YOUR PRINT STUDIO</span><h1>Create your account.</h1><p>Keep order history and delivery details together.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" autocomplete="name" required maxlength="120"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required maxlength="32"></label><label>Password <small>At least 10 characters</small><input name="password" type="password" autocomplete="new-password" minlength="10" required></label><button class="add-cart-button" type="submit"><span>CREATE ACCOUNT</span><b>&rarr;</b></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section></main></body></html>
